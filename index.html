<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WhatsApp Clone Pro Premium</title>
    <style>
        :root {
            --bg-main: #f3f0eb;
            --chat-bg-img: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');
            --chat-blend: overlay;
            --header-bg: #f4f1eb;
            --header-text: #111b21;
            --sub-text: #667781;
            --icon-color: #54656f;
            --msg-left-bg: #ffffff;
            --msg-left-text: #111b21;
            --msg-right-bg: #e2f7cb;
            --msg-right-text: #111b21;
            --input-container-bg: #ffffff;
            --time-text: #667781;
            --time-right-text: #667781;
            --tick-color: #53bdeb;
            --banner-bg: #ffeecd;
            --banner-text: #3b3c3d;
            --divider-bg: #ffffff;
            --divider-text: #54656f;
            --emoji-bg: #f0f2f5;
        }

        [data-theme="dark"] {
            --bg-main: #0b141a;
            --chat-bg-img: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');
            --chat-blend: soft-light;
            --header-bg: #202c33;
            --header-text: #e9edef;
            --sub-text: #8696a0;
            --icon-color: #aebac1;
            --msg-left-bg: #202c33;
            --msg-left-text: #e9edef;
            --msg-right-bg: #630d0d;
            --msg-right-text: #e9edef;
            --input-container-bg: #2a3942;
            --time-text: #8696a0;
            --time-right-text: #aebac1;
            --tick-color: #53bdeb;
            --banner-bg: #182229;
            --banner-text: #fad97b;
            --divider-bg: #182229;
            --divider-text: #8696a0;
            --emoji-bg: #111b21;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        
        html, body {
            background-color: var(--bg-main);
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .chat-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* --- HEADER STYLES --- */
        .chat-header {
            background-color: var(--header-bg);
            color: var(--header-text);
            padding: 10px 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            z-index: 50;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        .header-left { display: flex; align-items: center; gap: 2px; max-width: 75%; }
        
        /* DIUBAH: Penyesuaian container & ukuran ikon panah kembali agar presisi seperti WA */
        .back-icon-btn { 
            display: flex; 
            align-items: center; 
            justify-content: center;
            cursor: pointer; 
            padding: 4px;
            margin-right: 2px;
        }
        .back-icon-btn svg {
            width: 24px;
            height: 24px;
            fill: var(--header-text);
        }

        .avatar { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; }
        .user-info { display: flex; flex-direction: column; margin-left: 8px; overflow: hidden; }
        .user-name { font-weight: 500; font-size: 16.5px; color: var(--header-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .user-status { font-size: 11.5px; color: var(--sub-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
        
        .header-icons { display: flex; align-items: center; gap: 20px; color: var(--icon-color); padding-right: 4px; }
        .icon-svg { width: 22px; height: 22px; fill: none; stroke: var(--icon-color); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
        .icon-dots { width: 16px; height: 22px; fill: var(--icon-color); cursor: pointer; padding: 2px; }

        /* --- CHAT TIMELINE BOX --- */
        .chat-box {
            flex: 1; 
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background-color: var(--bg-main);
            background-image: var(--chat-bg-img);
            background-blend-mode: var(--chat-blend);
        }
        
        .date-divider { align-self: center; background-color: var(--divider-bg); color: var(--divider-text); font-size: 12px; padding: 5px 12px; border-radius: 8px; margin: 10px 0; box-shadow: 0 1px 0.5px rgba(0,0,0,0.08); }
        .encryption-banner { align-self: center; background-color: var(--banner-bg); color: var(--banner-text); font-size: 12px; text-align: center; padding: 9px 14px; border-radius: 10px; line-height: 1.4; max-width: 96%; margin-bottom: 10px; box-shadow: 0 1px 0.5px rgba(0,0,0,0.05); }

        /* Bubble Pesan */
        .message {
            max-width: 85%;
            padding: 6px 10px 5px 10px;
            font-size: 15px;
            line-height: 1.4;
            position: relative;
            box-shadow: 0 1px 0.5px rgba(0,0,0,0.1);
            word-wrap: break-word;
            user-select: none;
        }
        .msg-left { align-self: flex-start; background-color: var(--msg-left-bg); color: var(--msg-left-text); border-radius: 0px 8px 8px 8px; }
        .msg-right { align-self: flex-end; background-color: var(--msg-right-bg); color: var(--msg-right-text); border-radius: 8px 0px 8px 8px; }
        
        .message img.chat-img { width: 100%; max-width: 260px; border-radius: 6px; margin-bottom: 4px; display: block; }
        .chat-caption { font-size: 15px; margin-top: 4px; margin-bottom: 4px; display: block; }
        
        .time { 
            font-size: 11px; 
            color: var(--time-text); 
            float: right; 
            margin-top: 5px; 
            margin-left: 8px; 
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .msg-right .time {
            color: var(--time-right-text);
        }
        
        .tick-svg {
            display: inline-block;
            vertical-align: middle;
            margin-left: 1px;
        }
        .tick-svg path {
            stroke: var(--tick-color);
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* --- BAR BOTTOM INPUT --- */
        .bottom-bar {
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: transparent;
            flex-shrink: 0;
            width: 100%;
            z-index: 40;
        }
        .input-row {
            display: flex;
            align-items: flex-end;
            gap: 6px;
            width: 100%;
        }
        .input-container {
            flex: 1; background-color: var(--input-container-bg); border-radius: 25px; display: flex; align-items: center; padding: 0 14px; box-shadow: 0 1px 1px rgba(0,0,0,0.05); min-height: 48px;
        }
        
        .input-icon-btn { width: 24px; height: 24px; fill: none; stroke: var(--icon-color); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; cursor: pointer; flex-shrink: 0; }
        input[type="text"] { flex: 1; border: none; outline: none; padding: 10px 4px; font-size: 16px; background: transparent; color: var(--header-text); width: 100%; }
        
        .input-right-icons { display: flex; gap: 14px; align-items: center; flex-shrink: 0; }
        .send-button { width: 48px; height: 48px; background-color: #008069; border-radius: 50%; display: flex; justify-content: center; align-items: center; box-shadow: 0 1px 2px rgba(0,0,0,0.15); border: none; cursor: pointer; flex-shrink: 0; user-select: none; -webkit-user-select: none; }
        .send-button svg { width: 22px; height: 22px; fill: #ffffff; }

        .reply-mode-active { background-color: #34b7f1 !important; transform: scale(1.05); }

        /* --- PANEL EMOJI SYSTEM --- */
        .emoji-panel {
            display: none;
            width: 100%;
            height: 220px;
            background-color: var(--emoji-bg);
            border-top: 1px solid rgba(0,0,0,0.08);
            overflow-y: auto;
            padding: 12px;
            grid-template-columns: repeat(8, 1fr);
            gap: 12px;
            justify-items: center;
            user-select: none;
        }
        .emoji-item {
            font-size: 26px;
            cursor: pointer;
            transition: transform 0.1s ease;
        }
        .emoji-item:active {
            transform: scale(1.2);
        }

        /* --- MODAL CAMERA PREVIEW --- */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.85); z-index: 100; justify-content: center; align-items: center; padding: 20px;
        }
        .modal-card { background: var(--input-container-bg); width: 100%; max-width: 360px; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; color: var(--header-text); }
        .modal-card img { width: 100%; max-height: 300px; object-fit: contain; border-radius: 8px; }
        .modal-card input { padding: 12px; border: 1px solid var(--icon-color); border-radius: 8px; font-size: 15px; outline: none; width: 100%; background: transparent; color: var(--header-text); }
        .modal-actions { display: flex; justify-content: flex-end; gap: 12px; }
        .modal-actions button { padding: 10px 20px; border: none; border-radius: 20px; font-weight: 600; cursor: pointer; user-select: none; -webkit-user-select: none; }
        .btn-cancel { background: rgba(0,0,0,0.05); color: var(--icon-color); }
        .btn-send { background: #008069; color: #ffffff; transition: background-color 0.2s ease; }

        /* --- PANEL DIALOG PENGATURAN DROPDOWN --- */
        .config-panel { 
            display: none; position: fixed; top: 60px; right: 15px; width: 290px; background: var(--input-container-bg); border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,0.3); padding: 16px; z-index: 60; color: var(--header-text); 
        }
        .config-panel h4 { margin-bottom: 12px; border-bottom: 1px solid var(--icon-color); padding-bottom: 6px; }
        .config-panel label { font-size: 12px; color: var(--icon-color); display: block; margin-top: 10px; font-weight: 600; }
        .config-panel input, .config-panel select { width: 100%; padding: 8px 10px; margin-top: 4px; border: 1px solid var(--icon-color); border-radius: 6px; background: transparent; color: var(--header-text); font-size: 14px; }
        
        .config-panel .btn-action-container { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
        .config-panel .close-btn { background: #008069; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; }
        .config-panel .clear-btn { background: #b00020; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; }
    </style>
</head>
<body>

<div class="chat-container">
    
    <div class="chat-header">
        <div class="header-left">
            <div class="back-icon-btn">
                <svg viewBox="0 0 24 24">
                    <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
                </svg>
            </div>
            <img src="https://i.pravatar.cc/100?img=60" id="chatAvatar" class="avatar" alt="Avatar">
            <div class="user-info">
                <div class="user-name" id="chatName">Pak Syarif Lg</div>
                <div class="user-status" id="chatStatus">terakhir dilihat hari ini pukul 19.49</div>
            </div>
        </div>
        <div class="header-icons">
            <svg class="icon-svg" viewBox="0 0 24 24"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
            <svg class="icon-svg" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
            <svg class="icon-dots" id="menuDots" viewBox="0 0 4 16" onclick="toggleConfig()">
                <circle cx="2" cy="2" r="2"/>
                <circle cx="2" cy="8" r="2"/>
                <circle cx="2" cy="14" r="2"/>
            </svg>
        </div>
    </div>

    <div class="chat-box" id="chatBox" onclick="closeEmojiPanel()">
        <div class="date-divider">Hari ini</div>
        <div class="encryption-banner">
            🔒 Pesan dan telepon terenkripsi secara end-to-end. Hanya orang di obrolan ini yang bisa membaca, mendengarkan, atau membagikannya. <strong>Pelajari selengkapnya.</strong>
        </div>
    </div>

    <input type="file" id="attachImageInput" accept="image/*" style="display: none;">
    <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display: none;">

    <div class="bottom-bar">
        <div class="input-row">
            <div class="input-container">
                <svg class="input-icon-btn" id="emojiToggleBtn" viewBox="0 0 24 24" onclick="toggleEmojiPanel(event)">
                    <circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/>
                </svg>
                
                <input type="text" id="msgInput" placeholder="Pesan" onkeypress="checkEnter(event)" onclick="closeEmojiPanel()">
                
                <div class="input-right-icons">
                    <svg class="input-icon-btn" id="attachBtn" viewBox="0 0 24 24" style="transform: rotate(45deg);">
                        <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
                    </svg>
                    <svg class="input-icon-btn" id="openCameraBtn" viewBox="0 0 24 24">
                        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>
                    </svg>
                </div>
            </div>
            
            <button class="send-button" id="sendBtn">
                <svg viewBox="0 0 24 24">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                </svg>
            </button>
        </div>

        <div class="emoji-panel" id="emojiPanel"></div>
    </div>

    <div class="modal-overlay" id="previewModal">
        <div class="modal-card">
            <img id="previewImg" src="" alt="Preview">
            <input type="text" id="captionInput" placeholder="Tambah keterangan (opsional)...">
            <div class="modal-actions">
                <button class="btn-cancel" id="cancelUploadBtn">Batal</button>
                <button class="btn-send" id="confirmUploadBtn">Kirim</button>
            </div>
        </div>
    </div>

    <div class="config-panel" id="configPanel">
        <h4>Menu Simulasi</h4>
        
        <label>Tema WhatsApp:</label>
        <select id="themeSelect" onchange="changeTheme()">
            <option value="light">Light Mode (Terang)</option>
            <option value="dark">Dark Mode (Gelap)</option>
        </select>
        
        <label>Nama Kontak:</label>
        <input type="text" id="newNameInput" value="Pak Syarif Lg">
        
        <label>Status Waktu Obrolan (Sub-header):</label>
        <input type="text" id="newStatusInput" value="terakhir dilihat hari ini pukul 19.49">
        
        <label>Foto Profil:</label>
        <input type="file" id="fileImgInput" accept="image/*" onchange="previewProfileFile()">
        
        <div class="btn-action-container">
            <button class="clear-btn" onclick="clearAllChats()">🧹 Bersihkan Chat</button>
            <button class="close-btn" onclick="applyConfig()">Simpan & Tutup</button>
        </div>
    </div>

</div>

<script>
    const msgInput = document.getElementById('msgInput');
    const sendBtn = document.getElementById('sendBtn');
    const chatBox = document.getElementById('chatBox');
    const emojiPanel = document.getElementById('emojiPanel');

    let chatHistory = JSON.parse(localStorage.getItem('wa_local_chats')) || [];
    let pressTimer;
    let isLongPress = false;

    const emojiList = [
        "😀","😃","😄","😁","😆","😅","😂","🤣","😊","😇","🙂","🙃","😉","😌","😍","🥰",
        "😘","😗","😙","😚","😋","😛","😝","😜","🤪","🤨","🧐","🤓","😎","🤩","🥳","😏",
        "😒","😞","😔","😟","😕","🙁","☹️","😣","😖","😫","😩","🥺","😢","😭","😤","😠",
        "😡","🤬","🤯","😳","🥵","🥶","😱","😨","😰","😥","😓","🤗","🤔","🤭","🤫","🤥",
        "😶","😐","😑","😬","🙄","😯","😦","😧","😮","😲","🥱","😴","🤤","😪","😵","🤐",
        "🥴","🤢","🤮","🤧","😷","🤒","🤕","🤑","🤠","😈","👿","👹","👺","🤡","💩","👻",
        "💀","☠️","👽","👾","🤖","🎃","😺","😸","😹","😻","😼","😽","🙀","😾","🙌","👏",
        "👋","👍","👎","👊","✊","🤛","🤜","🤞","✌️","🤟","🤘","👌","🤌","🤏","👈","👉",
        "👆","👇","☝️","✋","🤚","🖐","🖖","✍️","🙏","💪","🦾","🖕","✍️","❤️","🧡","💛"
    ];

    window.addEventListener('DOMContentLoaded', () => {
        loadSavedConfig();
        renderAllMessages();
        initEmojiPanel();
        setTimeout(scrollToBottom, 200);
    });

    function scrollToBottom() {
        chatBox.scrollTop = chatBox.scrollHeight;
    }
    
    msgInput.addEventListener('focus', () => {
        setTimeout(scrollToBottom, 300);
    });

    function initEmojiPanel() {
        emojiPanel.innerHTML = '';
        emojiList.forEach(emoji => {
            const span = document.createElement('span');
            span.classList.add('emoji-item');
            span.innerText = emoji;
            span.onclick = (e) => {
                e.stopPropagation();
                msgInput.value += emoji;
                msgInput.focus();
            };
            emojiPanel.appendChild(span);
        });
    }

    function toggleEmojiPanel(event) {
        event.stopPropagation();
        if (emojiPanel.style.display === 'grid') {
            closeEmojiPanel();
        } else {
            emojiPanel.style.display = 'grid';
            setTimeout(scrollToBottom, 100);
        }
    }

    function closeEmojiPanel() {
        emojiPanel.style.display = 'none';
    }

    function checkEnter(event) { 
        if (event.key === 'Enter') {
            const textValue = msgInput.value.trim();
            if (textValue !== "") processNewMessage('right', textValue);
        }
    }

    const startPress = (e) => {
        const textValue = msgInput.value.trim();
        isLongPress = false;
        if (textValue !== "") {
            pressTimer = setTimeout(() => {
                isLongPress = true;
                sendBtn.classList.add('reply-mode-active');
                if (navigator.vibrate) navigator.vibrate(40);
            }, 800);
        }
    };

    const endPress = (e) => {
        clearTimeout(pressTimer);
        sendBtn.classList.remove('reply-mode-active');
        const textValue = msgInput.value.trim();
        
        if (textValue !== "") {
            if (isLongPress) {
                processNewMessage('left', textValue);
            } else {
                processNewMessage('right', textValue);
            }
        }
        isLongPress = false;
    };

    sendBtn.addEventListener('mousedown', startPress);
    sendBtn.addEventListener('touchstart', startPress, { passive: true });
    sendBtn.addEventListener('mouseup', endPress);
    sendBtn.addEventListener('touchend', endPress);

    function processNewMessage(side, contentText) {
        if (contentText === '') return;
        const now = new Date();
        const timeStr = String(now.getHours()).padStart(2, '0') + '.' + String(now.getMinutes()).padStart(2, '0');

        chatHistory.push({ side: side, content: contentText, time: timeStr });
        localStorage.setItem('wa_local_chats', JSON.stringify(chatHistory));

        renderAllMessages();
        scrollToBottom();
        msgInput.value = '';
    }

    function renderAllMessages() {
        const oldMessages = chatBox.querySelectorAll('.message');
        oldMessages.forEach(el => el.remove());

        chatHistory.forEach((msg, index) => {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', msg.side === 'left' ? 'msg-left' : 'msg-right');
            
            if (msg.side === 'right') {
                msgDiv.innerHTML = `${msg.content} <span class="time">${msg.time} <svg class="tick-svg" width="16" height="11" viewBox="0 0 16 11" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4.5 6L7 8.5L14 1.5M1.5 6L4 8.5M11 1.5L7 5.5"/></svg></span>`;
            } else {
                msgDiv.innerHTML = `${msg.content} <span class="time">${msg.time}</span>`;
            }

            let deleteTimer;
            msgDiv.addEventListener('touchstart', () => {
                deleteTimer = setTimeout(() => {
                    if (confirm('Hapus pesan ini?')) {
                        chatHistory.splice(index, 1);
                        localStorage.setItem('wa_local_chats', JSON.stringify(chatHistory));
                        renderAllMessages();
                    }
                }, 1000);
            });
            msgDiv.addEventListener('touchend', () => clearTimeout(deleteTimer));

            chatBox.appendChild(msgDiv);
        });
    }

    // ==========================================
    // MULTIMEDIA ATTACHMENT SYSTEM
    // ==========================================
    const attachBtn = document.getElementById('attachBtn');
    const openCameraBtn = document.getElementById('openCameraBtn');
    const attachImageInput = document.getElementById('attachImageInput');
    const cameraInput = document.getElementById('cameraInput');
    const previewModal = document.getElementById('previewModal');
    const previewImg = document.getElementById('previewImg');
    const captionInput = document.getElementById('captionInput');
    const confirmUploadBtn = document.getElementById('confirmUploadBtn');
    
    let tempImageBase64 = "";
    let imgPressTimer;
    let isImgLongPress = false;

    attachBtn.addEventListener('click', () => attachImageInput.click());
    openCameraBtn.addEventListener('click', () => cameraInput.click());

    function handleImageSelection(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                tempImageBase64 = e.target.result;
                previewImg.src = tempImageBase64;
                previewModal.style.display = 'flex';
                captionInput.focus();
            };
            reader.readAsDataURL(file);
        }
        event.target.value = '';
    }

    attachImageInput.addEventListener('change', handleImageSelection);
    cameraInput.addEventListener('change', handleImageSelection);

    document.getElementById('cancelUploadBtn').addEventListener('click', () => {
        previewModal.style.display = 'none';
        confirmUploadBtn.classList.remove('reply-mode-active');
        tempImageBase64 = "";
    });

    const startImgPress = (e) => {
        isImgLongPress = false;
        imgPressTimer = setTimeout(() => {
            isImgLongPress = true;
            confirmUploadBtn.classList.add('reply-mode-active');
            if (navigator.vibrate) navigator.vibrate(40);
        }, 800);
    };

    const endImgPress = (e) => {
        clearTimeout(imgPressTimer);
        
        if (tempImageBase64 !== "") {
            const caption = captionInput.value.trim();
            let imgHTML = `<img src="${tempImageBase64}" class="chat-img" alt="Photo">`;
            if (caption !== "") imgHTML += `<span class="chat-caption">${caption}</span>`;
            
            if (isImgLongPress) {
                processNewMessage('left', imgHTML);
            } else {
                processNewMessage('right', imgHTML);
            }
            
            previewModal.style.display = 'none';
            captionInput.value = "";
            confirmUploadBtn.classList.remove('reply-mode-active');
        }
        isImgLongPress = false;
    };

    confirmUploadBtn.addEventListener('mousedown', startImgPress);
    confirmUploadBtn.addEventListener('touchstart', startImgPress, { passive: true });
    confirmUploadBtn.addEventListener('mouseup', endImgPress);
    confirmUploadBtn.addEventListener('touchend', endImgPress);

    // ==========================================
    // CONFIG PANEL FUNCTIONS
    // ==========================================
    function toggleConfig() {
        const panel = document.getElementById('configPanel');
        panel.style.display = (panel.style.display === 'block') ? 'none' : 'block';
    }

    function changeTheme() {
        const themeValue = document.getElementById('themeSelect').value;
        document.documentElement.setAttribute('data-theme', themeValue);
        localStorage.setItem('wa_local_theme', themeValue);
    }

    function clearAllChats() {
        if (confirm('Apakah Anda yakin ingin membersihkan semua obrolan chat ini?')) {
            chatHistory = [];
            localStorage.setItem('wa_local_chats', JSON.stringify(chatHistory));
            renderAllMessages();
            toggleConfig();
        }
    }

    let base64ProfileImage = "";
    function previewProfileFile() {
        const file = document.getElementById('fileImgInput').files[0];
        const reader = new FileReader();
        reader.onloadend = () => { base64ProfileImage = reader.result; }
        if (file) reader.readAsDataURL(file);
    }

    function applyConfig() {
        const newName = document.getElementById('newNameInput').value.trim();
        const newStatus = document.getElementById('newStatusInput').value.trim();

        if (newName !== "") {
            document.getElementById('chatName').innerText = newName;
            localStorage.setItem('wa_local_name', newName);
        }
        
        document.getElementById('chatStatus').innerText = newStatus;
        localStorage.setItem('wa_local_status', newStatus);

        if (base64ProfileImage !== "") {
            document.getElementById('chatAvatar').src = base64ProfileImage;
            localStorage.setItem('wa_local_avatar', base64ProfileImage);
        }
        toggleConfig();
    }

    function loadSavedConfig() {
        const savedName = localStorage.getItem('wa_local_name');
        const savedStatus = localStorage.getItem('wa_local_status');
        const savedAvatar = localStorage.getItem('wa_local_avatar');
        const savedTheme = localStorage.getItem('wa_local_theme') || 'light';
        
        if (savedName) {
            document.getElementById('chatName').innerText = savedName;
            document.getElementById('newNameInput').value = savedName;
        }
        if (savedStatus !== null) {
            document.getElementById('chatStatus').innerText = savedStatus;
            document.getElementById('newStatusInput').value = savedStatus;
        }
        if (savedAvatar) document.getElementById('chatAvatar').src = savedAvatar;
        
        document.getElementById('themeSelect').value = savedTheme;
        document.documentElement.setAttribute('data-theme', savedTheme);
    }
</script>

</body>
</html>
