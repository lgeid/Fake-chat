<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
    <title>WhatsApp Clone - Real UI</title>
    <style>
        :root {
            /* Tema Light - Real WA */
            --bg-main: #efeae2;
            --chat-bg-img: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');
            --chat-blend: normal;
            --header-bg: #008069;
            --header-text: #ffffff;
            --sub-text: #e0f2f1;
            --icon-color: #ffffff;
            --msg-left-bg: #ffffff;
            --msg-left-text: #111b21;
            --msg-right-bg: #d9fdd3;
            --msg-right-text: #111b21;
            --call-missed-color: #ea0038;
            --input-container-bg: #ffffff;
            --input-icon-color: #8696a0;
            --time-text: #667781;
            --time-right-text: #667781;
            --tick-color: #53bdeb;
            --banner-bg: #ffeecd;
            --banner-text: #3b3c3d;
            --divider-bg: #ffffff;
            --divider-text: #54656f;
            --emoji-bg: #f0f2f5;
            --send-btn-bg: #00a884;
            
            --modal-bg: #ffffff;
            --modal-text: #111b21;
            --modal-border: #cccccc;
        }

        [data-theme="dark"] {
            /* Tema Dark - Real WA */
            --bg-main: #0b141a;
            --chat-bg-img: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');
            --chat-blend: soft-light;
            --header-bg: #202c33;
            --header-text: #e9edef;
            --sub-text: #8696a0;
            --icon-color: #aebac1;
            --msg-left-bg: #202c33;
            --msg-left-text: #e9edef;
            --msg-right-bg: #005c4b;
            --msg-right-text: #ffffff;
            --call-missed-color: #ff5252;
            --input-container-bg: #2a3942;
            --input-icon-color: #8696a0;
            --time-text: #8696a0;
            --time-right-text: #d1d7db;
            --tick-color: #53bdeb;
            --banner-bg: #182229;
            --banner-text: #fad97b;
            --divider-bg: #182229;
            --divider-text: #8696a0;
            --emoji-bg: #111b21;
            --send-btn-bg: #00a884;

            --modal-bg: #222e35;
            --modal-text: #e9edef;
            --modal-border: #3b4a54;
        }

        [data-theme="amoled"] {
            /* Tema AMOLED Dark */
            --bg-main: #000000;
            --chat-bg-img: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');
            --chat-blend: soft-light;
            --header-bg: #0a1014;
            --header-text: #e9edef;
            --sub-text: #8696a0;
            --icon-color: #aebac1;
            --msg-left-bg: #1e272c;
            --msg-left-text: #e9edef;
            --msg-right-bg: #005c4b;
            --msg-right-text: #ffffff;
            --call-missed-color: #ff5252;
            --input-container-bg: #1e272c;
            --input-icon-color: #8696a0;
            --time-text: #8696a0;
            --time-right-text: #d1d7db;
            --tick-color: #53bdeb;
            --banner-bg: #0a1014;
            --banner-text: #fad97b;
            --divider-bg: #0a1014;
            --divider-text: #8696a0;
            --emoji-bg: #000000;
            --send-btn-bg: #00a884;

            --modal-bg: #111b21;
            --modal-text: #e9edef;
            --modal-border: #222d34;
        }

        [data-theme="blue"] {
            /* Tema Biru - Ocean */
            --bg-main: #e4edf5;
            --chat-bg-img: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');
            --chat-blend: multiply;
            --header-bg: #2b5278;
            --header-text: #ffffff;
            --sub-text: #aebfd1;
            --icon-color: #ffffff;
            --msg-left-bg: #ffffff;
            --msg-left-text: #0f1419;
            --msg-right-bg: #e1f0fa;
            --msg-right-text: #0f1419;
            --call-missed-color: #ff3b30;
            --input-container-bg: #ffffff;
            --input-icon-color: #687a86;
            --time-text: #687a86;
            --time-right-text: #507185;
            --tick-color: #007aff;
            --banner-bg: #fff0d4;
            --banner-text: #1d252b;
            --divider-bg: #ffffff;
            --divider-text: #455a64;
            --emoji-bg: #e4edf5;
            --send-btn-bg: #2b5278;

            --modal-bg: #ffffff;
            --modal-text: #0f1419;
            --modal-border: #b0c4de;
        }

        [data-theme="pink"] {
            /* Tema Pink - Sakura */
            --bg-main: #fce4ec;
            --chat-bg-img: none;
            --chat-blend: normal;
            --header-bg: #e91e63;
            --header-text: #ffffff;
            --sub-text: #f8bbd0;
            --icon-color: #ffffff;
            --msg-left-bg: #ffffff;
            --msg-left-text: #212121;
            --msg-right-bg: #f8bbd0;
            --msg-right-text: #212121;
            --call-missed-color: #d32f2f;
            --input-container-bg: #ffffff;
            --input-icon-color: #757575;
            --time-text: #757575;
            --time-right-text: #616161;
            --tick-color: #1976d2;
            --banner-bg: #fff8e1;
            --banner-text: #424242;
            --divider-bg: #ffffff;
            --divider-text: #757575;
            --emoji-bg: #f8bbd0;
            --send-btn-bg: #e91e63;

            --modal-bg: #ffffff;
            --modal-text: #212121;
            --modal-border: #f48fb1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            background-color: var(--bg-main);
            width: 100%;
            height: 100%; 
            overflow: hidden;
            position: absolute;
            top: 0;
            left: 0;
        }

        body.keyboard-aktif .chat-box {
            padding-bottom: 20px !important;
        }

        .chat-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* --- HEADER --- */
        .chat-header {
            background-color: var(--header-bg);
            color: var(--header-text);
            padding: 10px 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            z-index: 50;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            transition: background-color 0.3s ease;
        }
        .header-left { display: flex; align-items: center; gap: 2px; max-width: 75%; }

        .back-icon-btn { display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 4px; margin-right: 2px; }
        .back-icon-btn svg { width: 24px; height: 24px; fill: var(--header-text); stroke-width: 2; transition: fill 0.3s ease;}

        .avatar { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; }
        .avatar-initials { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #ffffff; font-weight: 500; font-size: 15px; user-select: none; }
        .user-info { display: flex; flex-direction: column; margin-left: 8px; overflow: hidden; }

        .user-name { font-weight: 500; font-size: 16px; color: var(--header-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 19px; transition: color 0.3s ease;}
        .user-status { font-size: 12px; color: var(--sub-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; line-height: 14px; transition: color 0.3s ease;}

        .header-icons { display: flex; align-items: center; gap: 20px; color: var(--icon-color); padding-right: 4px; }
        .icon-svg { width: 22px; height: 22px; fill: none; stroke: var(--icon-color); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; cursor: pointer; transition: stroke 0.3s ease;}
        .icon-dots { width: 16px; height: 22px; fill: var(--icon-color); cursor: pointer; padding: 2px; transition: fill 0.3s ease;}

        /* --- CHAT BOX --- */
        .chat-box { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; background-color: var(--bg-main); background-image: var(--chat-bg-img); background-blend-mode: var(--chat-blend); transition: background-color 0.3s ease;}
        .date-divider { align-self: center; background-color: var(--divider-bg); color: var(--divider-text); font-size: 12px; padding: 5px 12px; border-radius: 8px; margin: 10px 0; box-shadow: 0 1px 0.5px rgba(0,0,0,0.08); font-weight: 500; transition: all 0.3s ease;}
        .encryption-banner { align-self: center; background-color: var(--banner-bg); color: var(--banner-text); font-size: 12px; text-align: center; padding: 9px 14px; border-radius: 10px; line-height: 1.4; max-width: 96%; margin-bottom: 10px; box-shadow: 0 1px 0.5px rgba(0,0,0,0.05); transition: all 0.3s ease;}

        /* Bubble Pesan Teks */
        .message {
            max-width: 85%;
            padding: 6px 10px 5px 10px;
            font-size: 15px;
            line-height: 1.4;
            position: relative;
            box-shadow: 0 1px 0.5px rgba(0,0,0,0.1);
            word-wrap: break-word;
            white-space: pre-wrap; /* Mendukung enter / baris baru */
            user-select: none;
            cursor: move;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .msg-left { align-self: flex-start; background-color: var(--msg-left-bg); color: var(--msg-left-text); border-radius: 0px 8px 8px 8px; }
        .msg-right { align-self: flex-end; background-color: var(--msg-right-bg); color: var(--msg-right-text); border-radius: 8px 0px 8px 8px; }

        /* KOTAK BALASAN (QUOTE / REPLY) DENGAN PEMBUNGKUSAN TEKS LENGKAP */
        .quoted-box {
            background-color: rgba(0, 0, 0, 0.05);
            border-left: 4px solid #062a4d;
            border-radius: 4px;
            padding: 5px 8px;
            margin-bottom: 4px;
            font-size: 12px;
        }
        .msg-right .quoted-box {
            background-color: rgba(0, 0, 0, 0.05);
            border-left-color: #025144;
        }
        [data-theme="dark"] .quoted-box, [data-theme="amoled"] .quoted-box {
            background-color: rgba(255, 255, 255, 0.08);
            border-left-color: #53bdeb;
        }
        [data-theme="dark"] .msg-right .quoted-box, [data-theme="amoled"] .msg-right .quoted-box {
            background-color: rgba(0, 0, 0, 0.2);
            border-left-color: #25d366;
        }
        .quoted-sender {
            font-weight: bold;
            color: #062a4d;
            font-size: 12px;
            margin-bottom: 2px;
        }
        .msg-right .quoted-sender {
            color: #025144;
        }
        [data-theme="dark"] .quoted-sender, [data-theme="amoled"] .quoted-sender {
            color: #53bdeb;
        }
        [data-theme="dark"] .msg-right .quoted-sender, [data-theme="amoled"] .msg-right .quoted-sender {
            color: #25d366;
        }
        .quoted-text {
            color: var(--time-text);
            line-height: 1.3;
            white-space: pre-wrap;
            word-break: break-word;
        }

        /* Stiker Bubble Style */
        .message.is-sticker {
            background-color: #262626 !important;
            color: #ffffff !important;
            border-radius: 18px !important;
            padding: 10px 16px !important;
            font-weight: bold;
            font-size: 14px;
            display: inline-block;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .message.has-image { padding: 4px 4px 6px 4px; }
        .message img.chat-img { width: 100%; max-width: 260px; border-radius: 6px; margin-bottom: 2px; display: block; }
        .chat-caption { font-size: 15px; padding: 2px 6px 14px 6px; display: inline-block; width: 100%; white-space: pre-wrap; }
        .message.has-image .time { position: absolute; bottom: 4px; right: 10px; }

        /* ITEM PANGGILAN */
        .call-item { 
            min-width: 220px;
            max-width: 80%; 
            background-color: var(--msg-left-bg); 
            color: var(--msg-left-text); 
            border-radius: 8px; 
            padding: 8px 12px; 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            box-shadow: 0 1px 0.5px rgba(0,0,0,0.1); 
            cursor: move; 
            position: relative;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .call-item.call-left { align-self: flex-start; border-radius: 0px 8px 8px 8px; }
        .call-item.call-right { align-self: flex-end; background-color: var(--msg-right-bg); color: var(--msg-right-text); border-radius: 8px 0px 8px 8px; }

        .call-badge {
            width: 38px;
            height: 38px;
            border-radius: 8px;
            background-color: rgba(0, 0, 0, 0.04);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        [data-theme="dark"] .call-badge,
        [data-theme="amoled"] .call-badge {
            background-color: rgba(255, 255, 255, 0.06);
        }

        .call-icon-svg { 
            width: 20px; 
            height: 20px; 
            fill: #111b21; 
        }
        [data-theme="dark"] .call-icon-svg,
        [data-theme="amoled"] .call-icon-svg {
            fill: #e9edef;
        }

        .call-content { display: flex; flex-direction: column; flex: 1; padding-right: 35px; }
        .call-title { font-size: 15px; font-weight: 600; line-height: 18px; color: var(--msg-left-text); }
        .msg-right .call-title { color: var(--msg-right-text); }
        .call-subtitle { font-size: 13px; color: #667781; margin-top: 2px; line-height: 16px; }
        [data-theme="dark"] .call-subtitle,
        [data-theme="amoled"] .call-subtitle { color: #8696a0; }

        .time { font-size: 11px; color: var(--time-text); float: right; margin-top: 5px; margin-left: 8px; display: inline-flex; align-items: center; gap: 4px; transition: color 0.3s ease;}
        .msg-right .time { color: var(--time-right-text); }
        .call-item .time { position: absolute; bottom: 6px; right: 8px; font-size: 11px; margin: 0; float: none; }

        .tick-svg { display: inline-block; vertical-align: middle; margin-left: 1px; }
        .tick-svg path { stroke: var(--tick-color); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: var(--tick-color); transition: stroke 0.3s ease, fill 0.3s ease;}

        /* --- BAR BOTTOM INPUT --- */
        .bottom-bar { 
            padding: 5px 6px 6px 6px; 
            display: flex; 
            flex-direction: column; 
            gap: 6px; 
            background: transparent; 
            flex-shrink: 0; 
            width: 100%; 
            z-index: 40; 
        }
        .input-row { 
            display: flex; 
            align-items: flex-end; 
            gap: 6px; 
            width: 100%; 
        }
        .input-container { 
            flex: 1; 
            background-color: var(--input-container-bg); 
            border-radius: 24px; 
            display: flex; 
            align-items: center; 
            padding: 4px 10px; 
            box-shadow: 0 1px 2px rgba(0,0,0,0.12); 
            min-height: 46px; 
            transition: background-color 0.3s ease;
        }

        .input-icon-btn { 
            width: 24px; 
            height: 24px; 
            fill: none; 
            stroke: var(--input-icon-color); 
            stroke-width: 1.8; 
            stroke-linecap: round; 
            stroke-linejoin: round; 
            cursor: pointer; 
            flex-shrink: 0; 
            transition: stroke 0.3s ease;
        }
        
        /* Textarea fleksibel untuk multi-line */
        textarea.main-input { 
            flex: 1; 
            border: none; 
            outline: none; 
            padding: 8px 8px; 
            font-size: 16px; 
            background: transparent; 
            color: var(--msg-left-text); 
            width: 100%; 
            resize: none;
            max-height: 100px;
            min-height: 24px;
            transition: color 0.3s ease;
        }
        textarea.main-input::placeholder { 
            color: var(--input-icon-color); 
            font-size: 16px;
        }

        .input-right-icons { 
            display: flex; 
            gap: 12px; 
            align-items: center; 
            flex-shrink: 0; 
            padding-right: 2px;
        }
        .send-button { 
            width: 46px; 
            height: 46px; 
            background-color: var(--send-btn-bg); 
            border-radius: 50%; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            box-shadow: 0 1px 2px rgba(0,0,0,0.18); 
            border: none; 
            cursor: pointer; 
            flex-shrink: 0; 
            user-select: none; 
            -webkit-user-select: none; 
            transition: background-color 0.3s ease;
        }
        .send-button svg { width: 20px; height: 20px; fill: #ffffff; }

        /* EMOJI & STICKER PANEL */
        .emoji-panel { 
            display: none; 
            width: 100%; 
            height: 200px; 
            background-color: var(--emoji-bg); 
            border-top: 1px solid rgba(0,0,0,0.08); 
            overflow-y: auto; 
            padding: 12px; 
            flex-direction: column;
            gap: 12px;
            user-select: none; 
            transition: background-color 0.3s ease;
        }

        .emoji-row {
            display: flex;
            gap: 15px;
            justify-content: center;
            align-items: center;
            padding-bottom: 8px;
            border-bottom: 1px dashed var(--input-icon-color);
        }

        .emoji-item { font-size: 28px; cursor: pointer; transition: transform 0.1s ease; }
        .emoji-item:active { transform: scale(1.2); }

        .sticker-section-title {
            font-size: 12px;
            color: var(--time-text);
            font-weight: bold;
            margin-top: 4px;
        }

        .sticker-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .sticker-btn {
            background: #202c33;
            color: #ffffff;
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.1);
            transition: background 0.2s;
        }
        .sticker-btn:active {
            background: #00a884;
        }
        
        /* Modals & Popups */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.75); z-index: 100; justify-content: center; align-items: center; padding: 20px; }
        
        .modal-card { 
            background: var(--modal-bg) !important; 
            color: var(--modal-text) !important; 
            width: 100%; 
            max-width: 360px; 
            max-height: 90vh;
            overflow-y: auto;
            border-radius: 12px; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            border: 1px solid var(--modal-border);
        }
        
        .modal-card h4 {
            color: var(--modal-text) !important;
            font-size: 18px;
            margin-bottom: 4px;
        }

        .modal-card label {
            color: var(--modal-text) !important;
            font-size: 13px;
            font-weight: 600;
            opacity: 0.9;
        }

        .modal-card img { width: 100%; max-height: 300px; object-fit: contain; border-radius: 8px; }
        
        .modal-card input, .modal-card select, .modal-card textarea { 
            padding: 10px 12px; 
            border: 1px solid var(--modal-border) !important; 
            border-radius: 8px; 
            font-size: 15px; 
            outline: none; 
            width: 100%; 
            background: transparent !important; 
            color: var(--modal-text) !important; 
        }

        .modal-card select option {
            background: var(--modal-bg);
            color: var(--modal-text);
        }

        .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
        .modal-actions button { padding: 10px 16px; border: none; border-radius: 20px; font-weight: 600; cursor: pointer; flex: 1; }
        .btn-cancel { background: #e0e0e0; color: #333333; }
        .btn-delete { background: #e53935; color: #ffffff; } 
        .btn-send { background: #008069; color: #ffffff; transition: background-color 0.2s ease; }
        
        .config-panel { 
            display: none; 
            position: fixed; 
            top: 60px; 
            right: 15px; 
            width: 320px; 
            background: var(--modal-bg); 
            border-radius: 12px; 
            box-shadow: 0 4px 24px rgba(0,0,0,0.4); 
            padding: 16px; 
            z-index: 60; 
            color: var(--modal-text); 
            border: 1px solid var(--modal-border);
        }
        .config-panel h4 { margin-bottom: 12px; border-bottom: 1px solid var(--modal-border); padding-bottom: 6px; color: var(--modal-text); }
        .config-panel label { font-size: 12px; color: var(--modal-text); opacity: 0.8; display: block; margin-top: 10px; font-weight: 600; }
        .config-panel input, .config-panel select { width: 100%; padding: 8px 10px; margin-top: 4px; border: 1px solid var(--modal-border); border-radius: 6px; background: transparent; color: var(--modal-text); font-size: 14px; }
        .config-panel select option { background: var(--modal-bg); color: var(--modal-text); }
        .config-panel .btn-action-container { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
        .config-panel .close-btn { background: #008069; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; }
        .config-panel .clear-btn { background: #b00020; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; }
        .config-panel .initials-btn { background: #34b7f1; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 8px; }
        
        .dragging { opacity: 0.6; transform: scale(0.98); z-index: 10; }
        .drop-zone { border: 2px dashed var(--icon-color); border-radius: 8px; }
        
        /* POPUP POSISI DENGAN BARIS BARU */
        .posisi-popup { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #1f2c34; color: #fff; padding: 22px 18px; border-radius: 16px; z-index: 200; width: 88%; max-width: 320px; box-shadow: 0 0 20px rgba(0,0,0,0.6); border: 1px solid #3b4a54; text-align: center; }
        .posisi-popup h4 { font-size: 16px; margin-bottom: 16px; text-transform: uppercase; letter-spacing: 1px; color: #e9edef; }
        .btn-gaming-container { display: flex; flex-direction: column; gap: 10px; justify-content: center; }
        .btn-row { display: flex; gap: 10px; }
        .btn-gaming { flex: 1; padding: 12px 10px; border: none; border-radius: 10px; font-weight: bold; font-size: 14px; cursor: pointer; transition: all 0.2s ease; }
        .btn-kiri { background: #008069; color: #fff; }
        .btn-kanan { background: #00a884; color: #fff; }
        .btn-enter { background: #3b4a54; color: #e9edef; border: 1px dashed #8696a0; }
        .btn-enter:active { background: #2a3942; }
        .overlay-popup { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 199; }
    </style>
</head>
<body>

<div class="chat-container">

    <div class="chat-header">
        <div class="header-left">
            <div class="back-icon-btn">
                <svg viewBox="0 0 24 24">
                    <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
                </svg>
            </div>
            <div id="avatarContainer">
                <img src="https://i.pravatar.cc/100?img=12" id="chatAvatar" class="avatar" alt="Avatar">
            </div>
            <div class="user-info">
                <div id="chatName" class="user-name">Pak Syarif Lg</div>
                <div id="chatStatus" class="user-status">terakhir dilihat kemarin pukul 21.12</div>
            </div>
        </div>
        <div class="header-icons">
            <svg class="icon-svg" id="callVoiceBtn" viewBox="0 0 24 24" title="Panggilan Suara">
                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
            </svg>
            <svg class="icon-svg" id="callVideoBtn" viewBox="0 0 24 24" title="Panggilan Video">
                <path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
            </svg>
            <svg class="icon-dots" id="menuDots" viewBox="0 0 4 16" onclick="toggleConfig()">
                <circle cx="2" cy="2" r="2"/>
                <circle cx="2" cy="8" r="2"/>
                <circle cx="2" cy="14" r="2"/>
            </svg>
        </div>
    </div>

    <div class="chat-box" id="chatBox" onclick="closeEmojiPanel()">
        <div class="encryption-banner">
            🔒 Pesan dan telepon terenkripsi secara end-to-end. Hanya orang di obrolan ini yang bisa membaca, mendengarkan, atau membagikannya. <strong>Pelajari selengkapnya.</strong>
        </div>
    </div>

    <input type="file" id="attachImageInput" accept="image/*" style="display: none;">
    <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display: none;">

    <div class="bottom-bar">
        <div class="input-row">
            <div class="input-container">
                <svg class="input-icon-btn" id="emojiToggleBtn" viewBox="0 0 24 24" onclick="toggleEmojiPanel(event)">
                    <circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/>
                </svg>

                <textarea id="msgInput" class="main-input" rows="1" placeholder="Ketik pesan" onclick="closeEmojiPanel()" oninput="autoResizeInput(this); toggleSendIcon()"></textarea>

                <div class="input-right-icons">
                    <svg class="input-icon-btn" id="attachBtn" viewBox="0 0 24 24" style="transform: rotate(45deg);">
                        <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
                    </svg>
                    <svg class="input-icon-btn" id="openCameraBtn" viewBox="0 0 24 24">
                        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>
                    </svg>
                </div>
            </div>

            <button class="send-button" id="actionBtn" onclick="kirimPesan()">
                <svg id="micIcon" viewBox="0 0 24 24" width="22" height="22" fill="#ffffff">
                    <path d="M11.999 14.942c2.001 0 3.531-1.53 3.531-3.531V4.35c0-2.001-1.53-3.531-3.531-3.531S8.468 2.349 8.468 4.35v7.061c0 2.001 1.53 3.531 3.531 3.531zm6.238-3.53c0 3.531-2.942 6.002-6.237 6.002s-6.237-2.471-6.237-6.002H3.761c0 4.001 3.178 7.297 7.061 7.885v3.884h2.354v-3.884c3.884-.588 7.061-3.884 7.061-7.885h-2.001z"/>
                </svg>
                <svg id="sendIcon" viewBox="0 0 24 24" width="22" height="22" fill="#ffffff" style="display: none;">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                </svg>
            </button>
        </div>

        <div class="emoji-panel" id="emojiPanel"></div>
    </div>

    <div class="overlay-popup" id="overlayPosisi" onclick="tutupPopup()"></div>
    <div class="posisi-popup" id="posisiPopup">
        <h4>PILIH POSISI PESAN</h4>
        <div class="btn-gaming-container">
            <div class="btn-row">
                <button class="btn-gaming btn-kiri" onclick="pilihPosisi('left')">⬅️ Kiri</button>
                <button class="btn-gaming btn-kanan" onclick="pilihPosisi('right')">Kanan ➡️</button>
            </div>
            <button class="btn-gaming btn-enter" onclick="tambahBarisBaru()">➕ Baris Baru (Enter)</button>
        </div>
    </div>

    <div class="modal-overlay" id="editModal">
        <div class="modal-card">
            <h4 id="editTitle">Ubah Data</h4>
            <label>Posisi Pesan:</label>
            <select id="editCallSide">
                <option value="left">Kiri (Penerima)</option>
                <option value="right">Kanan (Pengirim)</option>
            </select>
            
            <label id="textMsgLabel">Isi Pesan Utama:</label>
            <textarea id="editMsgText" rows="2" placeholder="Tulis isi pesan..."></textarea>

            <label id="statusLabel" style="display: none;">Status Panggilan:</label>
            <select id="editCallStatus" style="display: none;">
                <option value="done">Berhasil / Terjawab</option>
                <option value="missed">❌ Tidak Dijawab / Tak Terjawab</option>
            </select>

            <label id="durasiLabel" style="display: none;">Durasi / Keterangan:</label>
            <input type="text" id="editCallDuration" placeholder="Contoh: 53 dtk" style="display: none;">

            <label>Jam & Menit (hh.mm):</label>
            <input type="text" id="editTimeValue" placeholder="Contoh: 17.27">

            <label>Tanggal Pesan:</label>
            <input type="date" id="editDateValue">

            <!-- DUKUNGAN FITUR BALASAN PESAN (QUOTE) -->
            <div id="quoteSection" style="border-top: 1px dashed var(--modal-border); padding-top: 8px; margin-top: 4px;">
                <label style="color: #00a884;">Balasan Pesan (Quote / Reply):</label>
                <label style="font-weight: normal; margin-top: 4px;">Nama Pengirim Dibalas:</label>
                <input type="text" id="editQuoteSender" placeholder="Contoh: Pak Syarif Lg / Anda">
                <label style="font-weight: normal; margin-top: 4px;">Isi Pesan Dibalas:</label>
                <textarea id="editQuoteText" rows="2" placeholder="Teks pesan yang dibalas..."></textarea>
            </div>

            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeEditModal()">Batal</button>
                <button class="btn-delete" onclick="deleteSelectedMessage()">Hapus</button>
                <button class="btn-send" onclick="saveEditChanges()">Simpan</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="previewModal">
        <div class="modal-card">
            <img id="previewImg" src="" alt="Preview">
            <input type="text" id="captionInput" placeholder="Tambah keterangan (opsional)...">
            <div class="modal-actions">
                <button class="btn-cancel" id="cancelUploadBtn">Batal</button>
                <button class="btn-send" id="confirmUploadBtn">Kirim</button>
            </div>
        </div>
    </div>

    <div class="config-panel" id="configPanel">
        <h4>⚙️ Menu Simulasi</h4>
        <label>Tema WhatsApp:</label>
        <select id="themeSelect" onchange="changeTheme()">
            <option value="light">☀️ Light Mode (Real)</option>
            <option value="dark">🌙 Dark Mode (Real)</option>
            <option value="amoled">🖤 Dark AMOLED (Pekat)</option>
            <option value="blue">🌊 Tema Biru (Ocean)</option>
            <option value="pink">🌸 Tema Pink (Sakura)</option>
        </select>
        <label>✏️ Ubah Nama / Nomor:</label>
        <input type="text" id="newNameInput" value="Pak Syarif Lg" placeholder="Contoh: 081234567890">
        <label>✏️ Ubah Status / Waktu:</label>
        <input type="text" id="newStatusInput" value="terakhir dilihat kemarin pukul 21.12" placeholder="Contoh: online / terakhir dilihat...">
        <label>🖼️ Foto Profil:</label>
        <input type="file" id="fileImgInput" accept="image/*" onchange="previewProfileFile()">
        <div class="btn-action-container">
            <button class="initials-btn" onclick="buatAvatarInisial()">✨ Buat Foto dari Inisial</button>
            <button class="clear-btn" onclick="clearAllChats()">🧹 Bersihkan Semua Chat</button>
            <button class="close-btn" onclick="applyConfig()">✅ Simpan Perubahan & Tutup</button>
        </div>
    </div>

</div>

<script>
    const msgInput = document.getElementById('msgInput');
    const actionBtn = document.getElementById('actionBtn');
    const chatBox = document.getElementById('chatBox');
    const emojiPanel = document.getElementById('emojiPanel');
    const editModal = document.getElementById('editModal');
    let selectedItemIndex = null;
    let tempActionCallback = null;

    let chatHistory = JSON.parse(localStorage.getItem('wa_local_chats_v2')) || [];

    const emojiList = ["🙏","👍","😁","🫣","🫡","🚨","📢","🤔"];
    
    const stickerList = [
        "Assalamualaikum",
        "Waalaikumsalam",
        "Selamat Pagi ☀️",
        "Selamat Siang 🌤️",
        "Selamat Malam 🌙",
        "Terima Kasih 🙏"
    ];

    window.addEventListener('DOMContentLoaded', () => {
        loadSavedConfig();
        renderAllMessages();
        initEmojiPanel();
        initCallButtons();
        setTimeout(scrollToBottom, 200);
        setupKeyboardFix(); 
    });

    function autoResizeInput(el) {
        el.style.height = 'auto';
        el.style.height = (el.scrollHeight < 100 ? el.scrollHeight : 100) + 'px';
    }

    function toggleSendIcon() {
        const textVal = msgInput.value.trim();
        const micIcon = document.getElementById('micIcon');
        const sendIcon = document.getElementById('sendIcon');

        if (textVal.length > 0) {
            micIcon.style.display = 'none';
            sendIcon.style.display = 'block';
        } else {
            micIcon.style.display = 'block';
            sendIcon.style.display = 'none';
        }
    }

    function setupKeyboardFix() {
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', () => {
                const currentHeight = window.visualViewport.height;
                document.body.style.height = currentHeight + 'px';
                
                if (currentHeight < window.innerHeight - 100) {
                    document.body.classList.add('keyboard-aktif');
                } else {
                    document.body.classList.remove('keyboard-aktif');
                }

                window.scrollTo(0, 0);
                setTimeout(scrollToBottom, 100);
            });
        } else {
            window.addEventListener('resize', () => {
                setTimeout(scrollToBottom, 100);
            });
        }
    }

    function scrollToBottom() {
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function initEmojiPanel() {
        emojiPanel.innerHTML = '';
        
        const emojiRow = document.createElement('div');
        emojiRow.className = 'emoji-row';
        emojiList.forEach(emoji => {
            const span = document.createElement('span');
            span.classList.add('emoji-item');
            span.innerText = emoji;
            span.onclick = (e) => {
                e.stopPropagation();
                msgInput.value += emoji;
                msgInput.focus();
                autoResizeInput(msgInput);
                toggleSendIcon(); 
            };
            emojiRow.appendChild(span);
        });
        emojiPanel.appendChild(emojiRow);

        const stickerTitle = document.createElement('div');
        stickerTitle.className = 'sticker-section-title';
        stickerTitle.innerText = 'STIKER TEKS PASIR:';
        emojiPanel.appendChild(stickerTitle);

        const stickerGrid = document.createElement('div');
        stickerGrid.className = 'sticker-grid';
        
        stickerList.forEach(stk => {
            const btn = document.createElement('div');
            btn.className = 'sticker-btn';
            btn.innerText = stk;
            btn.onclick = (e) => {
                e.stopPropagation();
                bukaPopupPosisi((posisi) => {
                    processNewMessage('sticker', posisi, stk);
                    closeEmojiPanel();
                });
            };
            stickerGrid.appendChild(btn);
        });
        
        emojiPanel.appendChild(stickerGrid);
    }

    function toggleEmojiPanel(event) {
        event.stopPropagation();
        if (emojiPanel.style.display === 'flex') {
            closeEmojiPanel();
        } else {
            emojiPanel.style.display = 'flex';
            setTimeout(scrollToBottom, 100);
        }
    }

    function closeEmojiPanel() {
        emojiPanel.style.display = 'none';
    }

    function bukaPopupPosisi(callback) {
        tempActionCallback = callback;
        document.getElementById('overlayPosisi').style.display = 'block';
        document.getElementById('posisiPopup').style.display = 'block';
    }
    
    function pilihPosisi(arah) {
        document.getElementById('overlayPosisi').style.display = 'none';
        document.getElementById('posisiPopup').style.display = 'none';
        if(tempActionCallback) tempActionCallback(arah);
        tempActionCallback = null;
    }

    function tambahBarisBaru() {
        document.getElementById('overlayPosisi').style.display = 'none';
        document.getElementById('posisiPopup').style.display = 'none';
        tempActionCallback = null;

        msgInput.value += "\n";
        msgInput.focus();
        autoResizeInput(msgInput);
        toggleSendIcon();
    }
    
    function tutupPopup(){
        document.getElementById('overlayPosisi').style.display = 'none';
        document.getElementById('posisiPopup').style.display = 'none';
        tempActionCallback = null;
    }
    
    function kirimPesan(){
        const textValue = msgInput.value.trim();
        if (textValue !== "") {
            bukaPopupPosisi((posisi) => {
                processNewMessage('text', posisi, msgInput.value);
                toggleSendIcon(); 
            });
        }
    }

    function initCallButtons() {
        document.getElementById('callVoiceBtn').addEventListener('click', () => {
            bukaPopupPosisi((posisi) => {
                const jenis = confirm("Status Telepon Suara:\n\nOK = Berhasil / Terjawab\nBatal = ❌ Tidak Dijawab");
                let data = {
                    type: 'call',
                    callType: 'voice',
                    status: jenis ? 'done' : 'missed',
                    duration: jenis ? prompt("Masukkan durasi (contoh: 53 dtk):", "53 dtk") : "Tidak dijawab",
                    side: posisi,
                    time: getCurrentTime(),
                    date: new Date().toISOString()
                };
                chatHistory.push(data);
                saveHistory();
                renderAllMessages();
            });
        });

        document.getElementById('callVideoBtn').addEventListener('click', () => {
            bukaPopupPosisi((posisi) => {
                const jenis = confirm("Status Telepon Video:\n\nOK = Berhasil / Terjawab\nBatal = ❌ Tidak Dijawab");
                let data = {
                    type: 'call',
                    callType: 'video',
                    status: jenis ? 'done' : 'missed',
                    duration: jenis ? prompt("Masukkan durasi (contoh: 28 dtk):", "28 dtk") : "Tidak dijawab",
                    side: posisi,
                    time: getCurrentTime(),
                    date: new Date().toISOString()
                };
                chatHistory.push(data);
                saveHistory();
                renderAllMessages();
            });
        });
    }

    function getCurrentTime() {
        const now = new Date();
        return String(now.getHours()).padStart(2, '0') + '.' + String(now.getMinutes()).padStart(2, '0');
    }

    function getDateLabel(dateString) {
        const msgDate = new Date(dateString);
        const today = new Date();

        const msgOnlyDate = new Date(msgDate.getFullYear(), msgDate.getMonth(), msgDate.getDate());
        const todayOnlyDate = new Date(today.getFullYear(), today.getMonth(), today.getDate());

        const diffDays = Math.floor((todayOnlyDate - msgOnlyDate) / (1000 * 60 * 60 * 24));

        if (diffDays === 0) return "Hari ini";
        if (diffDays === 1) return "Kemarin";
        const options = { day: 'numeric', month: 'long', year: 'numeric' };
        return msgDate.toLocaleDateString('id-ID', options);
    }

    function processNewMessage(type, side, contentText) {
        if (contentText === '') return;
        const now = new Date();
        const fullDate = now.toISOString(); 
        const timeStr = getCurrentTime();

        let formattedContent = contentText;
        if (!contentText.includes('<img')) {
            formattedContent = contentText.replace(/\n/g, '<br>');
        }

        chatHistory.push({ 
            type: type,
            side: side, 
            content: formattedContent, 
            time: timeStr,
            date: fullDate,
            quoteSender: '',
            quoteText: ''
        });
        saveHistory();
        renderAllMessages();
        scrollToBottom();
        msgInput.value = '';
        msgInput.style.height = 'auto';
    }

    function renderAllMessages() {
        const oldElements = chatBox.querySelectorAll('.message, .call-item, .date-divider');
        oldElements.forEach(el => el.remove());

        let lastLabel = "";

        chatHistory.forEach((item, index) => {
            const currentLabel = getDateLabel(item.date);

            if (currentLabel !== lastLabel) {
                const divider = document.createElement('div');
                divider.className = 'date-divider';
                divider.innerText = currentLabel;
                chatBox.appendChild(divider);
                lastLabel = currentLabel;
            }

            let element;

            if (item.type === 'call') {
                element = document.createElement('div');
                element.className = `call-item draggable call-${item.side}`;
                element.draggable = true;
                element.dataset.index = index;

                let iconSvg = '';
                if (item.callType === 'voice') {
                    iconSvg = `<svg class="call-icon-svg" viewBox="0 0 24 24">
                        <path d="M19.23 15.26l-2.54-.29a1.99 1.99 0 0 0-1.64.57l-1.84 1.84a15.045 15.045 0 0 1-6.59-6.59l1.85-1.85c.43-.43.64-1.03.57-1.64l-.29-2.52a2.001 2.001 0 0 0-1.99-1.77H4.03c-1.13 0-2.07.94-2 2.07 1.07 15.7 13.9 20 18 20 1.13 0 2.07-.94 2.07-2.07v-2.95c0-1.03-.81-1.92-1.87-2.01zM15 3l2.29 2.29-4.88 4.88 1.42 1.42 4.88-4.88L21 9V3h-6z"/>
                    </svg>`;
                } else {
                    iconSvg = `<svg class="call-icon-svg" viewBox="0 0 24 24">
                        <path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/>
                    </svg>`;
                }

                const title = item.callType === 'voice' ? 'Telepon suara' : 'Telepon video';
                const subtitle = item.duration ? item.duration : (item.status === 'missed' ? 'Tidak dijawab' : 'Terjawab');

                element.innerHTML = `
                    <div class="call-badge">
                        ${iconSvg}
                    </div>
                    <div class="call-content">
                        <div class="call-title">${title}</div>
                        <div class="call-subtitle">${subtitle}</div>
                    </div>
                    <span class="time">${item.time}</span>
                `;

                element.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    openEditModal(index, true);
                });

            } else {
                element = document.createElement('div');
                element.className = `message draggable ${item.side === 'left' ? 'msg-left' : 'msg-right'}`;
                
                if (item.type === 'sticker') {
                    element.classList.add('is-sticker');
                }

                if (item.content.includes('<img')) {
                    element.classList.add('has-image');
                }

                element.draggable = true;
                element.dataset.index = index;

                // TAMPILKAN KOTAK QUOTE JIKA ADA
                let quoteHTML = '';
                if (item.quoteText && item.quoteText.trim() !== '') {
                    quoteHTML = `
                        <div class="quoted-box">
                            <div class="quoted-sender">${item.quoteSender || 'Pengirim'}</div>
                            <div class="quoted-text">${item.quoteText}</div>
                        </div>
                    `;
                }

                element.innerHTML = `${quoteHTML}${item.content} <span class="time">${item.time} ${item.side === 'right' ? '<svg class="tick-svg" width="16" height="11" viewBox="0 0 16 11"><path d="M4.5 6L7 8.5L14 1.5M1.5 6L4 8.5M11 1.5L7 5.5"/></svg>' : ''}</span>`;

                element.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    openEditModal(index, false);
                });
            }

            chatBox.appendChild(element);
        });

        initDragAndDrop();
    }

    function openEditModal(index, isCall = false) {
        selectedItemIndex = index;
        const item = chatHistory[index];

        if (isCall) {
            document.getElementById('editTitle').innerText = "Ubah Data Panggilan";
            document.getElementById('editCallSide').value = item.side;
            document.getElementById('editCallStatus').value = item.status;
            document.getElementById('editCallDuration').value = item.duration || "";
            document.getElementById('editTimeValue').value = item.time;

            document.getElementById('textMsgLabel').style.display = 'none';
            document.getElementById('editMsgText').style.display = 'none';
            document.getElementById('statusLabel').style.display = 'block';
            document.getElementById('editCallStatus').style.display = 'block';
            document.getElementById('durasiLabel').style.display = 'block';
            document.getElementById('editCallDuration').style.display = 'block';
            document.getElementById('quoteSection').style.display = 'none';
        } else {
            document.getElementById('editTitle').innerText = "Ubah Data Pesan";
            document.getElementById('editCallSide').value = item.side;
            
            // Konversi kembali <br> ke baris baru untuk diedit di textarea
            let rawText = item.content.replace(/<br\s*\/?>/mg, "\n");
            document.getElementById('editMsgText').value = rawText;
            document.getElementById('editTimeValue').value = item.time;

            document.getElementById('textMsgLabel').style.display = 'block';
            document.getElementById('editMsgText').style.display = 'block';
            document.getElementById('statusLabel').style.display = 'none';
            document.getElementById('editCallStatus').style.display = 'none';
            document.getElementById('durasiLabel').style.display = 'none';
            document.getElementById('editCallDuration').style.display = 'none';
            document.getElementById('quoteSection').style.display = 'block';

            document.getElementById('editQuoteSender').value = item.quoteSender || "";
            document.getElementById('editQuoteText').value = item.quoteText || "";
        }

        if (item.date) {
            const dateObj = new Date(item.date);
            const yyyy = dateObj.getFullYear();
            const mm = String(dateObj.getMonth() + 1).padStart(2, '0');
            const dd = String(dateObj.getDate()).padStart(2, '0');
            document.getElementById('editDateValue').value = `${yyyy}-${mm}-${dd}`;
        } else {
            document.getElementById('editDateValue').value = ""; 
        }

        editModal.style.display = 'flex';
    }

    function closeEditModal() {
        editModal.style.display = 'none';
        selectedItemIndex = null;
    }

    function deleteSelectedMessage() {
        if (selectedItemIndex !== null) {
            const konfirmasi = confirm("Apakah kamu yakin ingin menghapus pesan ini?");
            if (konfirmasi) {
                chatHistory.splice(selectedItemIndex, 1);
                saveHistory();
                renderAllMessages();
                closeEditModal();
            }
        }
    }

    function saveEditChanges() {
        const item = chatHistory[selectedItemIndex];

        item.side = document.getElementById('editCallSide').value;
        item.time = document.getElementById('editTimeValue').value.trim() || item.time;

        if (item.type === 'call') {
            item.status = document.getElementById('editCallStatus').value;
            item.duration = document.getElementById('editCallDuration').value;
        } else {
            let updatedText = document.getElementById('editMsgText').value;
            if (!updatedText.includes('<img')) {
                updatedText = updatedText.replace(/\n/g, '<br>');
            }
            item.content = updatedText;
            item.quoteSender = document.getElementById('editQuoteSender').value.trim();
            item.quoteText = document.getElementById('editQuoteText').value.trim();
        }

        const newDate = document.getElementById('editDateValue').value;
        if (newDate) {
            const oldDateObj = item.date ? new Date(item.date) : new Date();
            const [year, month, day] = newDate.split('-');
            oldDateObj.setFullYear(year, month - 1, day);
            item.date = oldDateObj.toISOString();
        }

        saveHistory();
        renderAllMessages();
        closeEditModal();
    }

    let draggedElement = null;
    function initDragAndDrop() {
        const items = document.querySelectorAll('.draggable');
        items.forEach(el => {
            el.addEventListener('dragstart', (e) => {
                draggedElement = el;
                el.classList.add('dragging');
                e.dataTransfer.effectAllowed = 'move';
            });
            el.addEventListener('dragover', (e) => {
                e.preventDefault();
                el.classList.add('drop-zone');
            });
            el.addEventListener('dragleave', () => el.classList.remove('drop-zone'));
            el.addEventListener('drop', (e) => {
                e.preventDefault();
                el.classList.remove('drop-zone');
                if (draggedElement && draggedElement !== el) {
                    const fromIndex = parseInt(draggedElement.dataset.index);
                    const toIndex = parseInt(el.dataset.index);

                    const temp = chatHistory[fromIndex];
                    chatHistory.splice(fromIndex, 1);
                    chatHistory.splice(toIndex, 0, temp);

                    saveHistory();
                    renderAllMessages();
                }
            });
            el.addEventListener('dragend', () => {
                draggedElement.classList.remove('dragging');
                draggedElement = null;
            });
        });
    }

    const attachBtn = document.getElementById('attachBtn');
    const openCameraBtn = document.getElementById('openCameraBtn');
    const attachImageInput = document.getElementById('attachImageInput');
    const cameraInput = document.getElementById('cameraInput');
    const previewModal = document.getElementById('previewModal');
    const previewImg = document.getElementById('previewImg');
    const captionInput = document.getElementById('captionInput');
    const confirmUploadBtn = document.getElementById('confirmUploadBtn');

    let tempImageBase64 = "";

    attachBtn.addEventListener('click', () => attachImageInput.click());
    openCameraBtn.addEventListener('click', () => cameraInput.click());

    function handleImageSelection(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                tempImageBase64 = e.target.result;
                previewImg.src = tempImageBase64;
                previewModal.style.display = 'flex';
                captionInput.focus();
            };
            reader.readAsDataURL(file);
        }
        event.target.value = '';
    }

    attachImageInput.addEventListener('change', handleImageSelection);
    cameraInput.addEventListener('change', handleImageSelection);

    document.getElementById('cancelUploadBtn').addEventListener('click', () => {
        previewModal.style.display = 'none';
        tempImageBase64 = "";
    });

    confirmUploadBtn.addEventListener('click', () => {
        if (tempImageBase64 !== "") {
            const caption = captionInput.value.trim();
            let imgHTML = `<img src="${tempImageBase64}" class="chat-img" alt="Photo">`;
            if (caption !== "") imgHTML += `<span class="chat-caption">${caption}</span>`;

            bukaPopupPosisi((posisi) => {
                processNewMessage('text', posisi, imgHTML);
                previewModal.style.display = 'none';
                captionInput.value = "";
            });
        }
    });

    function buatAvatarInisial() {
        const namaLengkap = document.getElementById('newNameInput').value.trim();
        if (!namaLengkap) return;

        const kata = namaLengkap.toUpperCase().split(' ');
        let inisial = "";
        kata.forEach(k => { if(k) inisial += k[0]; });
        inisial = inisial.substring(0,2);

        const warna = ['#25d366', '#128c7e', '#34b7f1', '#0097e6', '#9c27b0', '#e91e63', '#f44336', '#ff9800', '#795548', '#607d8b'];
        const warnaAcak = warna[Math.floor(Math.random() * warna.length)];

        const wadah = document.getElementById('avatarContainer');
        wadah.innerHTML = "";

        const avatarBaru = document.createElement('div');
        avatarBaru.className = 'avatar-initials';
        avatarBaru.style.backgroundColor = warnaAcak;
        avatarBaru.innerText = inisial;

        wadah.appendChild(avatarBaru);

        localStorage.setItem('wa_local_initials', inisial);
        localStorage.setItem('wa_local_initials_color', warnaAcak);
        localStorage.removeItem('wa_local_avatar');
    }

    function toggleConfig() {
        const panel = document.getElementById('configPanel');
        panel.style.display = (panel.style.display === 'block') ? 'none' : 'block';
    }

    function changeTheme() {
        const nilaiTema = document.getElementById('themeSelect').value;
        document.documentElement.setAttribute('data-theme', nilaiTema);
        localStorage.setItem('wa_local_theme', nilaiTema);
    }

    function clearAllChats() {
        if (confirm('Yakin mau hapus semua pesan?')) {
            chatHistory = [];
            saveHistory();
            renderAllMessages();
            toggleConfig();
        }
    }

    let base64FotoProfil = "";
    function previewProfileFile() {
        const file = document.getElementById('fileImgInput').files[0];
        if (file) {
            const reader = new FileReader();
            reader.onloadend = () => {
                base64FotoProfil = reader.result;
                document.getElementById('avatarContainer').innerHTML = `<img src="${base64FotoProfil}" class="avatar" id="chatAvatar" alt="Avatar">`;
                localStorage.setItem('wa_local_avatar', base64FotoProfil);
                localStorage.removeItem('wa_local_initials');
                localStorage.removeItem('wa_local_initials_color');
            };
            reader.readAsDataURL(file);
        }
    }

    function applyConfig() {
        const namaBaru = document.getElementById('newNameInput').value.trim();
        const statusBaru = document.getElementById('newStatusInput').value.trim();

        if (namaBaru) {
            document.getElementById('chatName').innerText = namaBaru;
            localStorage.setItem('wa_local_name', namaBaru);
        }
        if (statusBaru) {
            document.getElementById('chatStatus').innerText = statusBaru;
            localStorage.setItem('wa_local_status', statusBaru);
        }

        toggleConfig();
    }

    function loadSavedConfig() {
        const namaTersimpan = localStorage.getItem('wa_local_name');
        const statusTersimpan = localStorage.getItem('wa_local_status');
        const fotoTersimpan = localStorage.getItem('wa_local_avatar');
        const inisialTersimpan = localStorage.getItem('wa_local_initials');
        const warnaInisial = localStorage.getItem('wa_local_initials_color');
        const temaTersimpan = localStorage.getItem('wa_local_theme') || 'light';

        if (namaTersimpan) {
            document.getElementById('chatName').innerText = namaTersimpan;
            document.getElementById('newNameInput').value = namaTersimpan;
        }
        if (statusTersimpan) {
            document.getElementById('chatStatus').innerText = statusTersimpan;
            document.getElementById('newStatusInput').value = statusTersimpan;
        }

        const wadahAvatar = document.getElementById('avatarContainer');
        if (fotoTersimpan) {
            wadahAvatar.innerHTML = `<img src="${fotoTersimpan}" class="avatar" id="chatAvatar" alt="Avatar">`;
        } else if (inisialTersimpan && warnaInisial) {
            wadahAvatar.innerHTML = `<div class="avatar-initials" style="background-color: ${warnaInisial};">${inisialTersimpan}</div>`;
        }

        document.getElementById('themeSelect').value = temaTersimpan;
        document.documentElement.setAttribute('data-theme', temaTersimpan);
    }

    function saveHistory() {
        localStorage.setItem('wa_local_chats_v2', JSON.stringify(chatHistory));
    }
</script>

</body>
</html>
